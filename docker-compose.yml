services:
  postgres:
    image: postgres:16
    container_name: courtvision-postgres
    environment:
      POSTGRES_DB: courtvision_ml
      POSTGRES_USER: courtvision_user
      POSTGRES_PASSWORD: courtvision_local_dev
    ports:
      # Host 5433 avoids conflict with a local PostgreSQL install on 5432 (Windows/macOS).
      - "5433:5432"
    volumes:
      - courtvision_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtvision_user -d courtvision_ml"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: courtvision-api
    environment:
      PYTHONPATH: /app/src
      MLFLOW_TRACKING_URI: http://host.docker.internal:5000
      COURTVISION_API_LOAD_MODEL_ON_STARTUP: "false"
      COURTVISION_API_MODEL_ALIAS: Candidate
    ports:
      - "8000:8000"

volumes:
  courtvision_pgdata:
