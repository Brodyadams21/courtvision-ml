services:
  postgres:
    image: postgres:16
    container_name: courtvision-postgres
    environment:
      POSTGRES_DB: courtvision_ml
      POSTGRES_USER: courtvision_user
      POSTGRES_PASSWORD: courtvision_local_dev
    ports:
      # Host 5433 avoids conflict with a local PostgreSQL install on 5432 (Windows/macOS).
      - "5433:5432"
    volumes:
      - courtvision_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtvision_user -d courtvision_ml"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  courtvision_pgdata:
