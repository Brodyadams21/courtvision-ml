[project]
name = "courtvision-ml"
version = "0.1.0"
description = "Cloud-assisted basketball shot quality and player evaluation ML platform."
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "pipelines", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]